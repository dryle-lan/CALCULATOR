<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CDL Calculator</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;500;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>

  <!-- Ambient canvas background -->
  <canvas id="bg-canvas" aria-hidden="true"></canvas>

  <div class="wrapper">

    <!-- Header -->
    <header class="site-header" aria-label="Site header">
      <div class="header__logo">
        <span class="header__logo-bracket">[</span>
        <span class="header__logo-text" id="header-text">CDL CALCULATOR</span>
        <span class="header__logo-bracket">]</span>
      </div>
      <div class="header__line" aria-hidden="true"></div>
    </header>

    <!-- Calculator -->
    <main>
      <div class="calculator" id="calculator" role="application" aria-label="Calculator">

        <!-- Display -->
        <div class="display" aria-live="polite" aria-atomic="true">
          <div class="display__expr" id="expr"></div>
          <div class="display__value" id="value">0</div>
          <div class="display__cursor" aria-hidden="true"></div>
        </div>

        <!-- Keypad -->
        <div class="keypad" id="keypad">

          <!-- Row 1 -->
          <button class="key key--clear"   data-action="clear"                      aria-label="Clear">C</button>
          <button class="key key--back"    data-action="backspace"                  aria-label="Backspace">⌫</button>
          <button class="key key--op"      data-action="operator" data-op="%"       aria-label="Percent">%</button>
          <button class="key key--op"      data-action="operator" data-op="÷"       aria-label="Divide">÷</button>

          <!-- Row 2 -->
          <button class="key"              data-action="digit"    data-digit="7">7</button>
          <button class="key"              data-action="digit"    data-digit="8">8</button>
          <button class="key"              data-action="digit"    data-digit="9">9</button>
          <button class="key key--op"      data-action="operator" data-op="×"       aria-label="Multiply">×</button>

          <!-- Row 3 -->
          <button class="key"              data-action="digit"    data-digit="4">4</button>
          <button class="key"              data-action="digit"    data-digit="5">5</button>
          <button class="key"              data-action="digit"    data-digit="6">6</button>
          <button class="key key--op"      data-action="operator" data-op="−"       aria-label="Subtract">−</button>

          <!-- Row 4 -->
          <button class="key"              data-action="digit"    data-digit="1">1</button>
          <button class="key"              data-action="digit"    data-digit="2">2</button>
          <button class="key"              data-action="digit"    data-digit="3">3</button>
          <button class="key key--op"      data-action="operator" data-op="+"       aria-label="Add">+</button>

          <!-- Row 5 -->
          <button class="key key--sign"    data-action="sign"                       aria-label="Toggle sign">+/−</button>
          <button class="key"              data-action="digit"    data-digit="0">0</button>
          <button class="key"              data-action="decimal"                     aria-label="Decimal">.  </button>
          <button class="key key--equals"  data-action="equals"                     aria-label="Equals">=</button>

        </div>
      </div>
    </main>

    <footer class="site-footer" aria-label="Footer">
      <span class="footer__tag">v1.0.0</span>
      <span class="footer__sep" aria-hidden="true">·</span>
      <span class="footer__tag">keyboard ready</span>
    </footer>

  </div>

  <script src="script.js"></script>
</body>
</html>
